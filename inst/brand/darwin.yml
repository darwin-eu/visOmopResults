color:
  palette:
    white: "#ffffff"
    darwin_blue: "#003399"
  foreground: black
  background: white
  primary: darwin_blue

logo:
  path: darwin

typography:
  base:
    family: Calibri
    size: "11pt"

defaults:
  shiny:
    theme:
      preset: flatly
  visOmopResults:
    template: system.file("darwinReportRef.docx", package = "visOmopResults")
    plot:
      font_family: Calibri
      font_size: "11pt"
      background_color: white
      header_color: darwin_blue
      header_text_color: white
      header_text_bold: TRUE
      grid_major_color: "#d9d9d9"
      axis_color: "#252525"
      border_color: "#595959"
      legend_position: "right"
    table:
      font_family: Calibri
      font_size: "9pt"
      border_color: darwin_blue
      border_width: 0.5
      text_line_space: 1
      text_space_before: 0
      text_space_after: 6
      header:
        background_color: darwin_blue
        text_bold: TRUE
        align: center
        text_color: white
        border_color: white
        font_size: "9pt"
      header_name:
        background_color: darwin_blue
        text_bold: TRUE
        align: center
        text_color: white
        border_color: white
        font_size: "9pt"
      header_level:
        background_color: darwin_blue
        text_bold: TRUE
        align: center
        text_color: white
        border_color: white
        font_size: "9pt"
      column_name:
        background_color: darwin_blue
        text_bold: TRUE
        align: center
        text_color: white
        border_color: white
        font_size: "9pt"
      group_label:
        background_color: darwin_blue
        text_bold: TRUE
        text_color: white
        border_color: white
        font_size: "9pt"
      title:
        text_bold: TRUE
        align: center
        font_size: "15pt"
      subtitle:
        text_bold: TRUE
        align: center
        font_size: "12pt"
      body:
        border_width: 0.5
        border_color: darwin_blue
